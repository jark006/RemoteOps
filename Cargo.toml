[workspace]
members = ["crates/protocol", "crates/agent", "crates/proxy"]
resolver = "2"

[workspace.package]
version = "1.4.0"
edition = "2024"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[profile.release.package.sha2]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[workspace.dependencies]
globset = { version = "0.4", default-features = false }
if-addrs = "0.15"
getrandom = "0.3"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
windows-sys = "0.61"
