[workspace]
members = ["crates/protocol", "crates/agent", "crates/proxy"]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
globset = "0.4"
if-addrs = "0.15"
getrandom = "0.3"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
windows-sys = "0.61"
